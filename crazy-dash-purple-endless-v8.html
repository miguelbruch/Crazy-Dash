const BLOCK_SCALE=1.15;
const BLK_W=(CW-.02)*BLOCK_SCALE;
const BLK_H=1.08*BLOCK_SCALE;

// 1. Bloco sólido do Block Dash: construção com relevo em camadas (base, face frontal, chanfro interno, janela/vão e chevron)
function makeSolidBlockMesh(){
  const g=new THREE.Group();
  const baseMat=new THREE.MeshLambertMaterial({color:0x052c6e});
  const mainMat=new THREE.MeshLambertMaterial({color:0x147df5});
  const trimMat=new THREE.MeshLambertMaterial({color:0x5ce1ff});
  const recessMat=new THREE.MeshLambertMaterial({color:0x0a48a8});
  const whiteMat=new THREE.MeshBasicMaterial({color:0xffffff});

  // Corpo principal do bloco
  const body=new THREE.Mesh(new THREE.BoxGeometry(BLK_W,BLK_H,BLK_D),mainMat);
  g.add(body);

  // Borda/moldura frontal e traseira em alto relevo
  const frameThick=.08*BLOCK_SCALE;
  for(const zSign of [-1,1]){
    const zFace=zSign*(BLK_D/2+.015);
    const topBar=new THREE.Mesh(new THREE.BoxGeometry(BLK_W-.06,frameThick,.04),trimMat);
    topBar.position.set(0,BLK_H/2-frameThick/2-.03,zFace);
    const botBar=new THREE.Mesh(new THREE.BoxGeometry(BLK_W-.06,frameThick,.04),baseMat);
    botBar.position.set(0,-BLK_H/2+frameThick/2+.03,zFace);
    const leftBar=new THREE.Mesh(new THREE.BoxGeometry(frameThick,BLK_H-.12,.04),trimMat);
    leftBar.position.set(-BLK_W/2+frameThick/2+.03,0,zFace);
    const rightBar=new THREE.Mesh(new THREE.BoxGeometry(frameThick,BLK_H-.12,.04),trimMat);
    rightBar.position.set(BLK_W/2-frameThick/2-.03,0,zFace);
    g.add(topBar,botBar,leftBar,rightBar);

    // Painel rebaixado central característico dos blocos do Block Dash
    const inner=new THREE.Mesh(new THREE.BoxGeometry(BLK_W*.64,BLK_H*.62,.035),recessMat);
    inner.position.set(0,0,zSign*(BLK_D/2+.008));
    g.add(inner);

    // Chevron / seta de impulso no centro do bloco
    const chevL=new THREE.Mesh(new THREE.BoxGeometry(BLK_W*.22,.075,.045),whiteMat);
    chevL.position.set(-BLK_W*.085,-BLK_H*.02,zSign*(BLK_D/2+.026));
    chevL.rotation.z=0.58;
    const chevR=new THREE.Mesh(new THREE.BoxGeometry(BLK_W*.22,.075,.045),whiteMat);
    chevR.position.set(BLK_W*.085,-BLK_H*.02,zSign*(BLK_D/2+.026));
    chevR.rotation.z=-0.58;
    g.add(chevL,chevR);
  }

  // Crista superior chanfrada
  const topCap=new THREE.Mesh(new THREE.BoxGeometry(BLK_W*.92,.06*BLOCK_SCALE,BLK_D*.9),trimMat);
  topCap.position.set(0,BLK_H/2+.015,0);
  g.add(topCap);

  return g;
}

// 2. Bloco quebrável do Block Dash: construção com relevo, núcleo laranja/âmbar e placas/fissuras em 3D
function makeBreakBlockMesh(){
  const g=new THREE.Group();
  const darkMat=new THREE.MeshLambertMaterial({color:0x5e1802});
  const mainMat=new THREE.MeshLambertMaterial({color:0xff7b14});
  const hiMat=new THREE.MeshLambertMaterial({color:0xffc93c});
  const crackMat=new THREE.MeshBasicMaterial({color:0x2b0900});

  const body=new THREE.Mesh(new THREE.BoxGeometry(BLK_W,BLK_H,BLK_D),mainMat);
  g.add(body);

  // Moldura em chanfro claro
  const frameThick=.085*BLOCK_SCALE;
  for(const zSign of [-1,1]){
    const zFace=zSign*(BLK_D/2+.016);
    const topBar=new THREE.Mesh(new THREE.BoxGeometry(BLK_W-.06,frameThick,.04),hiMat);
    topBar.position.set(0,BLK_H/2-frameThick/2-.03,zFace);
    const botBar=new THREE.Mesh(new THREE.BoxGeometry(BLK_W-.06,frameThick,.04),darkMat);
    botBar.position.set(0,-BLK_H/2+frameThick/2+.03,zFace);
    const leftBar=new THREE.Mesh(new THREE.BoxGeometry(frameThick,BLK_H-.12,.04),hiMat);
    leftBar.position.set(-BLK_W/2+frameThick/2+.03,0,zFace);
    const rightBar=new THREE.Mesh(new THREE.BoxGeometry(frameThick,BLK_H-.12,.04),hiMat);
    rightBar.position.set(BLK_W/2-frameThick/2-.03,0,zFace);
    g.add(topBar,botBar,leftBar,rightBar);

    // Losango central rachado em relevo
    const dia=new THREE.Mesh(new THREE.BoxGeometry(BLK_W*.42,BLK_H*.42,.035),hiMat);
    dia.position.set(0,0,zSign*(BLK_D/2+.012));
    dia.rotation.z=Math.PI/4;
    g.add(dia);

    // Fissuras diagonais e cruzadas em relevo
    const c1=new THREE.Mesh(new THREE.BoxGeometry(BLK_W*.78,.065,.048),crackMat);
    c1.position.set(0,BLK_H*.08,zSign*(BLK_D/2+.026));
    c1.rotation.z=0.46;
    const c2=new THREE.Mesh(new THREE.BoxGeometry(BLK_W*.74,.065,.048),crackMat);
    c2.position.set(0,-BLK_H*.1,zSign*(BLK_D/2+.026));
    c2.rotation.z=-0.52;
    const c3=new THREE.Mesh(new THREE.BoxGeometry(.065,BLK_H*.82,.048),crackMat);
    c3.position.set(-BLK_W*.06,0,zSign*(BLK_D/2+.026));
    c3.rotation.z=0.14;
    g.add(c1,c2,c3);
  }

  return g;
}

    for(const w of walls){w.z+=wv*dt;w.ms.forEach(m=>m.position.z=w.z);w.spikes.forEach(q=>q.mesh.position.z=w.z);if(gameMode==='endless'&&!w.counted&&w.z>me.z+1){w.counted=true;waveNo++}}
        punchTime=Math.max(0,punchTime-dt);punchCooldown=Math.max(0,punchCooldown-dt);danceTime=Math.max(0,danceTime-dt);danceCooldown=Math.max(0,danceCooldown-dt);
    walls=walls.filter(w=>{
      if(w.z>PL1-.5){w.a=(w.a??1)-dt*2.2;w.lm.opacity=Math.max(0,w.a);
        w.ms.forEach(m=>{m.traverse(ch=>{if(ch.isMesh&&ch.material){if(!ch.userData.c){ch.material=ch.material.clone();ch.material.transparent=true;ch.userData.c=1}ch.material.opacity=Math.max(0,w.a)}})});
        if(w.a<=0){w.ms.forEach(m=>sc.remove(m));w.spikes.forEach(q=>sc.remove(q.mesh));return false}}
      return true});
    let ix=jx+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),iz=jz+(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
    const m=Math.hypot(ix,iz);if(m>1){ix/=m;iz/=m}
    const sy=Math.sin(yaw),cyw=Math.cos(yaw);const tx=ix*cyw-iz*sy,tz=ix*sy+iz*cyw;const smooth=Math.min(1,dt*(m>.05?11:8));moveX+=(tx-moveX)*smooth;moveZ+=(tz-moveZ)*smooth;me.ix=moveX;me.iz=moveZ;if(jh||keys.Space)me.j=.12;
    if(dvReq){dvReq=0;let dx=me.ix,dz=-me.iz;if(Math.hypot(dx,dz)<.2){dx=-sy;dz=-cyw}dive(me,dx,dz)}
    es.forEach(e=>step(e,dt));
    const active=es.filter(e=>e.active!==false),alive=active.filter(e=>!e.out).length;
    if(gameMode==='respawn'){for(const e of active){if(e.out){if(!e.respawnTimer)e.respawnTimer=1.15;e.respawnTimer-=dt;if(e.respawnTimer<=0){Object.assign(e,{x:e.p?0:R(-6,6),y:0,z:e.p?8:R(10,17),vx:0,vy:0,vz:0,out:0,gr:true,dc:0,dv:0,j:0,kb:0,respawnTimer:0});e.g.visible=true;e.g.position.set(e.x,e.y,e.z)}}}}else if(gameMode==='endless'){if(me.out)end(1)}else if(me.out)end(alive+1);else if(alive<=1)end(1);
  }
  for(const e of es){
    if(e.active===false||!e.g.visible)continue;
    const dvg=e.dv>0;e.g.position.set(e.x,e.y+(dvg?.35*CHAR_SCALE:0),e.z);
    const mv=state=='lobby'?0:Math.min(1,Math.hypot(e.vx,e.vz)/6);
    const ph=gt*14+e.i,am=dvg?0:(e.gr?mv*.9:.5);
    e.ll.rotation.x=Math.sin(ph)*am;e.rl.rotation.x=-Math.sin(ph)*am;
    e.la.rotation.x=dvg?-2.8:(e.gr?-Math.sin(ph)*am:-2.4);e.ra.rotation.x=dvg?-2.8:(e.gr?Math.sin(ph)*am:-2.4);
    e.b.scale.y=1.05+(e.gr&&!dvg?Math.abs(Math.sin(ph))*.04*mv:0);
    if(Math.hypot(e.vx,e.vz)>.32){const face=Math.atan2(-e.vx,-e.vz);let delta=(face-e.fy+Math.PI*3)%(Math.PI*2)-Math.PI;e.fy+=delta*Math.min(1,dt*13)}
    e.g.rotation.y=(dvg?e.hd:e.fy)+(e.p&&danceTime>0?gt*12:0);e.g.rotation.x=dvg?-1.35:0;e.g.rotation.z=e.p&&danceTime>0?Math.sin(gt*25)*.48:0;if(e.p&&punchTime>0)e.ra.rotation.x=-2.8;if(e.p&&danceTime>0){e.la.rotation.z=Math.sin(gt*18)*.8;e.ra.rotation.z=-Math.sin(gt*18)*.8}}
  voidFloor.position.y=-14;updateSky(gt);
  for(const l of laserRigs){const bob=Math.sin(gt*2.1+l.phase)*.22;const sway=Math.cos(gt*1.4+l.phase)*.11;l.rig.position.set(l.side*LASER_X+sway,l.baseY+bob,(LASER_Z0+LASER_Z1)/2);}
  $('br').textContent=punchCooldown>0?'SOCO '+punchCooldown.toFixed(1):'👊 SOCO';$('breakBtn').textContent=danceCooldown>0?'BREAK '+danceCooldown.toFixed(1):'💃 BREAK';$('status').textContent=punchTime>0?'SOCO!':danceTime>0?'DANÇANDO • ESPINHOS':'';
  if(state=='lobby'){yaw+=dt*.4;tgt.set(0,1.1*CHAR_SCALE,8)}
  else if(spectating){
    const list=getSpecTargets();
    if(specIdx>=list.length)specIdx=0;
    const tObj=list[specIdx];
    tgt.lerp(new THREE.Vector3(tObj.x,tObj.y*.5+1*CHAR_SCALE,tObj.z),Math.min(1,8*dt));
  }
  else if(!me.out)tgt.lerp(new THREE.Vector3(me.x,me.y*.5+1*CHAR_SCALE,me.z),Math.min(1,8*dt));
  cam.position.set(tgt.x+cdist*Math.sin(yaw)*Math.cos(pit),tgt.y+cdist*Math.sin(pit),tgt.z+cdist*Math.cos(yaw)*Math.cos(pit));
  cam.lookAt(tgt);
  if(state!='lobby')$('hud').textContent=gameMode==='endless'?'ONDA '+Math.max(1,waveNo)+' • '+wv.toFixed(1)+'×':gameMode==='tournament'?'🏆 TORNEIO • '+(roomSettings?.tournament?.name||'Crazy Dash'):'Vivos '+es.filter(e=>e.active!==false&&!e.out).length+'/'+es.filter(e=>e.active!==false).length+' • '+(gameMode==='respawn'?'TREINO':'NORMAL');
  ren.render(sc,cam);if(!$('loading').classList.contains('hide'))$('loading').classList.add('hide');requestAnimationFrame(loop);
}
